services:
  # ----------------------------------------------------------------------------
  # 1. RoadEye AI Flask Backend (Render Free Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: roadeye-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn.conf.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: FLASK_DEBUG
        value: "0"

  # ----------------------------------------------------------------------------
  # 2. RoadEye React Frontend (Render Free Static Site on Global Edge CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: roadeye-app
    runtime: static
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "" # Populate with your roadeye-api.onrender.com URL in Render Dashboard
